services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enviaya_api
    restart: unless-stopped
    working_dir: /var/www

    env_file:
      - .env

    ports:
      - "8000:8000"

    command: [ "php", "artisan", "octane:start", "--server=swoole", "--host=0.0.0.0", "--port=8000", "--workers=auto", "--task-workers=auto" ]

    networks:
      - dokploy-network

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enviaya_reverb
    restart: unless-stopped
    working_dir: /var/www

    env_file:
      - .env

    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080" ]

    ports:
      - "8080:8080"

    networks:
      - dokploy-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enviaya_queue
    restart: unless-stopped
    working_dir: /var/www

    env_file:
      - .env

    command: [ "php", "artisan", "queue:work", "rabbitmq", "--sleep=1", "--tries=3", "--timeout=300" ]

    networks:
      - dokploy-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enviaya_scheduler
    restart: unless-stopped
    working_dir: /var/www

    env_file:
      - .env

    command: [ "php", "artisan", "schedule:work" ]

    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
