version: "3.9"

services:

  api:
    image: testing-enviaya-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - test-vecipaya
    deploy:
      restart_policy:
        condition: on-failure

  reverb:
    image: testing-enviaya-api:latest
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - test-vecipaya
    deploy:
      restart_policy:
        condition: on-failure

  queue:
    image: testing-enviaya-api:latest
    command: php artisan queue:work rabbitmq --sleep=1 --tries=3 --timeout=300
    env_file:
      - .env
    networks:
      - test-vecipaya
    deploy:
      restart_policy:
        condition: on-failure

  scheduler:
    image: testing-enviaya-api:latest
    command: php artisan schedule:work
    env_file:
      - .env
    networks:
      - test-vecipaya
    deploy:
      restart_policy:
        condition: on-failure

networks:
  test-vecipaya:
    external: true
