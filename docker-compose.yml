version: "3.8"

services:
  traefik:
    image: traefik:v2.12
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=tu-email@correo.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/letsencrypt:/letsencrypt"
      - "./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml"

  enviaya-backendapi-wobzek:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/laravel
    volumes:
      - ./laravel:/var/www/laravel
      - ./reverb:/var/www/reverb
    labels:
      - "traefik.enable=true"
      # Laravel HTTP
      - "traefik.http.routers.enviaya.rule=Host(`enviaya.com.co`)"
      - "traefik.http.routers.enviaya.entrypoints=websecure"
      - "traefik.http.routers.enviaya.tls.certresolver=letsencrypt"
      - "traefik.http.services.enviaya.loadbalancer.server.port=9000"
      # Reverb WSS
      - "traefik.http.routers.reverb.rule=Host(`ws.enviaya.com.co`)"
      - "traefik.http.routers.reverb.entrypoints=websecure"
      - "traefik.http.routers.reverb.middlewares=websocket-headers@file"
      - "traefik.http.services.reverb.loadbalancer.server.port=8080"

  app:
    build: .
    container_name: enviaya_app
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - enviaya_network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: enviaya_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - enviaya_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: enviaya_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - enviaya_network

  redis:
    image: redis:7-alpine
    container_name: enviaya_redis
    restart: unless-stopped
    networks:
      - enviaya_network

volumes:
  db_data:
    driver: local

networks:
  enviaya_network:
    driver: bridge
