# =============================================================================
# DESPLIEGUE EN DOKPLOY
#
# Cuatro procesos, una sola imagen. El primer argumento del entrypoint decide
# qué es cada contenedor.
#
#   api        Octane/Swoole en el 8000. Es el único que migra la base.
#   reverb     El websocket en el 8080. Sin él, el seguimiento del pedido no
#              avanza solo en el teléfono.
#   worker     La cola. Acá se ENTREGAN los avisos por websocket, las
#              notificaciones al teléfono y los correos: sin este contenedor el
#              pedido cambia de estado igual, pero nadie se entera.
#   scheduler  El resumen diario de las 7:00 y las copias de seguridad.
#
# Un proceso por contenedor y no todos bajo supervisor: si la cola se atasca,
# Dokploy la reinicia sola sin tumbar la API.
#
# --- LO QUE HAY QUE HACER EN DOKPLOY ---
#
# 1. Variables de entorno: las de .env.example, en la pestaña Environment.
#    NO se copia ningún .env dentro de la imagen (ver .dockerignore).
# 2. Dominios, en la pestaña Domains:
#      api     → servicio "api",    puerto 8000   (p. ej. api.tudominio.com)
#      reverb  → servicio "reverb", puerto 8080   (p. ej. ws.tudominio.com)
#    Dokploy pone los certificados y las etiquetas de Traefik; por eso acá no
#    se publica ningún puerto al host.
# 3. La base de datos y Redis se crean como servicios propios de Dokploy y se
#    conectan a esta misma red.
# =============================================================================

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: enviaya-api:latest
  restart: unless-stopped
  working_dir: /var/www
  # El resto de las variables las inyecta Dokploy en el entorno del servicio.
  # No se lee ningún .env: no hay ninguno dentro de la imagen (.dockerignore).
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
  # CÓMO LLEGAR A LA BASE DE DATOS CUANDO VIVE EN EL MISMO SERVIDOR
  #
  # Un contenedor NO puede salir a la IP pública de su propio anfitrión: el
  # paquete sale por el puente de Docker, vuelve a entrar por la interfaz
  # pública y el cortafuegos lo descarta. El síntoma es exactamente este —
  # "Esperando a la base de datos…" hasta rendirse— aunque MySQL acepte
  # conexiones desde cualquier host y desde fuera se conecte sin problema.
  #
  # `host-gateway` resuelve `host.docker.internal` a la puerta de enlace del
  # puente, que es el anfitrión visto desde dentro. Poniendo
  # DB_HOST=host.docker.internal el tráfico se queda en la máquina y no toca
  # internet: más rápido y sin exponer nada.
  #
  # Con la base en un servicio de Dokploy, esto sobra y se usa su nombre.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # Lo que tiene que sobrevivir a un redespliegue: los PDF y los medios que
    # aún no viven en R2, y los registros. La imagen se reemplaza entera en
    # cada despliegue; esto no.
    - storage_data:/var/www/storage/app
    - storage_logs:/var/www/storage/logs
  networks:
    - dokploy-network

services:
  api:
    <<: *app
    command: ["api"]
    expose:
      - "8000"
    healthcheck:
      # /up es la ruta de salud de Laravel, y está exenta del modo
      # mantenimiento: si respondiera 503 con el mantenimiento encendido,
      # Dokploy daría el contenedor por muerto y lo reiniciaría en bucle.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Cinco minutos, y no noventa segundos.
      #
      # El PRIMER despliegue no es como los siguientes: espera a que la base
      # acepte conexiones, aplica un centenar de migraciones y recién entonces
      # abre el puerto. Con la ventana corta, Docker daba el contenedor por
      # enfermo mientras todavía estaba migrando, y como los otros tres
      # servicios dependen de que esté sano, se caía el despliegue entero con
      # "dependency failed to start".
      #
      # Durante start_period los fallos no cuentan: no retrasa nada cuando el
      # arranque es rápido, solo evita rendirse antes de tiempo.
      start_period: 300s

  reverb:
    <<: *app
    command: ["reverb"]
    expose:
      - "8080"
    # `service_started` y no `service_healthy`.
    #
    # Con la condición de salud, el despliegue entero quedaba atado a que la
    # API pasara su comprobación dentro del plazo que decidiera quien lanza el
    # `compose up`: Dokploy se cansaba de esperar y lo daba por fallido con
    # "dependency failed to start", aunque la API estuviera arrancando bien.
    #
    # Lo que estos contenedores necesitan —que las migraciones hayan corrido—
    # lo esperan ellos mismos en el entrypoint, mirando si existe la tabla
    # `cache`. Es una espera más precisa y no bloquea el despliegue.
    depends_on:
      - api
    healthcheck:
      # Reverb responde 404 a una petición HTTP normal, y eso ya demuestra que
      # está escuchando. Por eso se comprueba que la conexión se establezca y
      # no el código de respuesta.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["worker"]
    # `service_started` y no `service_healthy`.
    #
    # Con la condición de salud, el despliegue entero quedaba atado a que la
    # API pasara su comprobación dentro del plazo que decidiera quien lanza el
    # `compose up`: Dokploy se cansaba de esperar y lo daba por fallido con
    # "dependency failed to start", aunque la API estuviera arrancando bien.
    #
    # Lo que estos contenedores necesitan —que las migraciones hayan corrido—
    # lo esperan ellos mismos en el entrypoint, mirando si existe la tabla
    # `cache`. Es una espera más precisa y no bloquea el despliegue.
    depends_on:
      - api
    healthcheck:
      # Que el proceso siga vivo. `queue:work` no expone nada por HTTP.
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  scheduler:
    <<: *app
    command: ["scheduler"]
    # `service_started` y no `service_healthy`.
    #
    # Con la condición de salud, el despliegue entero quedaba atado a que la
    # API pasara su comprobación dentro del plazo que decidiera quien lanza el
    # `compose up`: Dokploy se cansaba de esperar y lo daba por fallido con
    # "dependency failed to start", aunque la API estuviera arrancando bien.
    #
    # Lo que estos contenedores necesitan —que las migraciones hayan corrido—
    # lo esperan ellos mismos en el entrypoint, mirando si existe la tabla
    # `cache`. Es una espera más precisa y no bloquea el despliegue.
    depends_on:
      - api

volumes:
  storage_data:
  storage_logs:

networks:
  dokploy-network:
    external: true
