# EJEMPLO: adaptar PHP, extensiones y DB antes de copiar al directorio .github/workflows/.
name: Backend quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, fileinfo
          coverage: none
      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate composer
        run: composer validate --no-check-publish
      - name: Audit dependencies
        run: composer audit --no-interaction
      - name: Check Pint
        run: ./vendor/bin/pint --test
      - name: Analyze with Larastan
        run: ./vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests
        run: php artisan test
      - name: File size warnings
        run: python3 scripts/check_file_sizes.py --root .
      - name: Module boundary warnings
        run: python3 scripts/check_module_boundaries.py --root .
