server {
    listen 80;
    server_name enviaya.com.co; # Cambia por tu dominio o deja _ para cualquier host
    root /var/www/public; # Carpeta public de Laravel
    index index.php index.html index.htm;

    # Manejo de archivos estáticos y rutas Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesamiento de PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Ajusta la versión de PHP según tu servidor
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Negar acceso a archivos ocultos (.htaccess, .env, etc)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Opcional: proteger uploads u otras carpetas sensibles
    # location /storage/ {
    #     internal;
    # }
    
    # Logs (opcional, útil para depuración)
    error_log /var/log/nginx/laravel_error.log;
    access_log /var/log/nginx/laravel_access.log;
}
